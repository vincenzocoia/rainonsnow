# Quantile regression forest on POT peaks (scripts/4-distributional_learning.r,
# apps/4a-distributional-learning-fit). Response and predictors are fixed.

dl_rqforest:
  yname: runoff_hourly
  xnames:
  - rainfall_hourly
  - snowmelt_hourly
  na_action: drop
  min_obs: 23
  ntree: 500
  mtry: 1
  nodesize: 23
  nthreads: 4

# Tail of each peak-hour predictive distribution (scripts/4-distributional_learning.r).
#
# The cell marginal is the equal-weight mixture of these predictive
# distributions. A mixture of GP tails is regularly varying with index
# min_i(1/xi_i), so with a shape fitted independently per hour the whole cell
# inherits max_i(xi_i) -- the noisiest single estimate. See
# scripts/experiments/tail-index-pooling.R.
gp_tail:
  # WHICH POOLING IS THIS? Within a cell, across that cell's peak hours. Every
  # grid cell is still fitted entirely on its own data. Nothing here shares
  # information between cells except `spatial_smoothing` below, which is off.
  #
  # "shared" -> one shape for the cell, a scale per peak hour (recommended).
  # "independent" -> previous behaviour, a separate shape per peak hour, which
  #                  makes the cell's marginal inherit max_i(xi_i).
  shape_pooling: shared

  # Quantile at which the GP tail is grafted onto the forest distribution.
  adaptive_threshold: 0.5

  # Bootstrap replicates for the shape standard error (needed by the spatial
  # smoothing below) and, if enabled, the bias correction. 0 disables both.
  n_boot: 25

  # Subtract the bootstrap estimate of the shape's bias. OFF by default: the
  # pooled MLE is biased low, but per-hour scale noise inflates the return
  # level by a similar amount in the other direction, and correcting only the
  # shape leaves that exposed. Measured over T = 10/100/1000 years:
  #   correction off -> 1.00x, 0.99x, 0.96x of the true return level
  #   correction on  -> 1.07x, 1.16x, 1.24x
  # See scripts/experiments/tail-index-pooling.R. Turn it on if the shape
  # itself, rather than the return level, is what you are reporting.
  bias_correct: false

  # THIS is the only setting that crosses cells: empirical-Bayes shrinkage of
  # each cell's shape toward its neighbours. OFF by default (radius 0), so each
  # cell is estimated entirely on its own.
  #
  # On a small grid it does not degrade gracefully into mild smoothing: with only
  # a handful of cells the between-cell variance is not identifiable, tau^2 comes
  # out zero, and every cell collapses to one common shape. On the 2x2 window
  # that means all four cells get the same tail index.
  #
  # It is worth turning on for a large grid: on a 7x7 field it cut the RMSE of
  # the shape by 27-49% whether the true field was flat, gently or steeply
  # varying, and never hurt (scripts/experiments/tail-index-pooling.R, part 2).
  spatial_smoothing:
    radius: 0
    min_neighbours: 2
